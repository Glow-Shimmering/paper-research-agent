<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>PRAgent Web V1.3 产品原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="prototype-strip">
    <span>产品原型 V1.3</span>
    <strong>全部为演示数据，不会联网或调用模型；工作区写入仅模拟</strong>
    <button class="strip-button" type="button" data-action="reset">重置原型</button>
  </div>

  <div class="app-shell">
    <aside class="sidebar" aria-label="研究任务导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">P</div>
        <div>
          <strong>PRAgent</strong>
          <span>证据驱动的研究助手</span>
        </div>
      </div>

      <button class="project-switcher" type="button" data-action="show-project">
        <span class="project-glyph">项</span>
        <span><small>当前项目</small><strong id="sidebar-project-name">大模型增强多任务推荐</strong></span>
        <span aria-hidden="true">⌄</span>
      </button>

      <div class="sidebar-action-row">
        <button class="new-research" type="button" data-action="new-chat"><span aria-hidden="true">＋</span> 新建对话</button>
        <button class="square-button" type="button" data-action="new-project" aria-label="新建项目">新项目</button>
      </div>

      <nav class="history" aria-label="项目对话">
        <p class="nav-label">项目对话</p>
        <div id="chat-list"></div>
      </nav>

      <div class="sidebar-footer">
        <button type="button" data-action="show-memory"><span aria-hidden="true">◇</span> 项目公共记忆 <span class="memory-count" id="memory-count">0</span></button>
        <button type="button" data-action="show-settings"><span aria-hidden="true">⚙</span> 模型与数据设置</button>
        <div class="workspace-note"><span class="status-dot library"></span><span><small>全局共享论文库</small><strong id="library-path">D:\Research\paper-library</strong></span></div>
        <div class="workspace-note"><span class="status-dot"></span><span><small>项目工作区</small><strong id="workspace-path">D:\Research\llm-mtl-review</strong></span></div>
      </div>
    </aside>

    <main class="workspace-shell">
      <header class="workspace-header">
        <div>
          <div class="breadcrumb"><strong id="header-project-name">大模型增强多任务推荐</strong> <span>/</span> <span id="header-chat-title">主题调研到综述</span></div>
          <h1 id="page-title">开始一项新研究</h1>
        </div>
        <div class="header-actions">
          <span class="save-state" id="save-state">原型自动保存</span>
          <button class="icon-button" type="button" data-action="open-feedback" aria-label="记录本页反馈">反馈</button>
        </div>
      </header>

      <div class="stage-nav" id="stage-nav" aria-label="研究进度"></div>

      <div class="split-workspace">
        <section class="conversation-panel" aria-label="Agent 对话">
          <div class="panel-heading">
            <div>
              <span class="agent-avatar">AI</span>
              <div><strong>研究 Agent</strong><small id="agent-status">等待你的目标</small></div>
            </div>
            <button class="subtle-button" type="button" data-action="show-context">已加载项目上下文</button>
          </div>
          <div class="conversation" id="conversation" aria-live="polite"></div>
          <form class="composer" id="composer">
            <label class="sr-only" for="goal-input">告诉 Agent 你的研究目标</label>
            <textarea id="goal-input" rows="3" placeholder="例如：帮我调研大模型如何增强多任务推荐，重点关注 2023 年后的方法和可复现方案。"></textarea>
            <div class="composer-footer">
              <span id="context-scope">可询问并修改当前及之前阶段</span>
              <button class="primary-button" type="submit" id="send-button">开始规划</button>
            </div>
          </form>
        </section>

        <section class="artifact-panel" aria-label="研究成果工作区">
          <div id="artifact-content"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="feedback-template">
    <div class="modal-header">
      <div><span class="eyebrow">原型评审</span><h2 id="modal-title">记录当前页面的问题</h2></div>
      <button class="close-button" type="button" data-action="close-modal" aria-label="关闭">×</button>
    </div>
    <p class="modal-copy">反馈会保存在当前浏览器中。写清“哪里不对”和“你希望怎样”，后续可以一次复制全部反馈。</p>
    <label class="field-label" for="feedback-input">当前页面：<strong id="feedback-screen"></strong></label>
    <textarea class="feedback-input" id="feedback-input" rows="6" placeholder="例如：这里不应该先选择论文，而应该让 Agent 先追问我的研究范围。"></textarea>
    <div class="modal-actions">
      <button class="secondary-button" type="button" data-action="copy-feedback">复制全部反馈</button>
      <button class="primary-button" type="button" data-action="save-feedback">保存本页反馈</button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
