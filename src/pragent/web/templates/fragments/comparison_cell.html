<div class="comparison-cell" id="cell-{{ cell.source_id }}-{{ cell.dimension_key }}">
  <p class="comparison-summary">{{ cell.summary }}</p>
  <span class="badge {% if cell.insufficient_evidence %}status failed{% else %}status ready{% endif %}">{% if cell.insufficient_evidence %}证据不足{% else %}证据 {{ cell.evidence_count }} 条{% endif %}</span>
  {% if revision and cell.evidence_count %}<button class="secondary compact" hx-get="/ui/projects/{{ project.id }}/comparisons/{{ artifact.id }}/revisions/{{ revision.id }}/cells/{{ cell.source_id }}/{{ cell.dimension_key }}/evidence" hx-target="#evidence-{{ cell.source_id }}-{{ cell.dimension_key }}" hx-swap="innerHTML">展开证据</button><div id="evidence-{{ cell.source_id }}-{{ cell.dimension_key }}"></div>{% endif %}
  {% if current and not freshness.stale %}<details><summary>人工编辑</summary><form method="post" hx-post="/ui/projects/{{ project.id }}/comparisons/{{ artifact.id }}/cells/{{ cell.source_id }}/{{ cell.dimension_key }}/edit" hx-target="#comparison-state" hx-swap="outerHTML"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="expected_artifact_version" value="{{ artifact.version }}"><textarea name="summary" maxlength="12000" required>{{ cell.summary }}</textarea><label class="check"><input type="checkbox" name="insufficient_evidence" {% if cell.insufficient_evidence %}checked{% endif %}>明确标记为证据不足</label><button type="submit">保存为新版本</button></form></details>{% endif %}
</div>
