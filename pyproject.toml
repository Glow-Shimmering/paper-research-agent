[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-research-agent"
dynamic = ["version"]
description = "PRAgent: evidence-first workspace for paper discovery, deep reading, comparison, and writing"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "fastembed>=0.3",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    "numpy>=1.26",
    "typer>=0.12",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "trafilatura>=2.0,<3",
    "uvicorn>=0.29",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "textual>=0.60",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pra = "pragent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pragent.__version__"}

[tool.setuptools.package-data]
pragent = [
    "web/legacy/*.html",
    "web/legacy/*.css",
    "web/legacy/*.js",
    "web/templates/*.html",
    "web/templates/fragments/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "web/static/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
