<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRAgent · 论文研究助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>PRAgent</h1>
  <nav>
    <a href="/ui/projects" id="workspace-link" class="workspace-link">研究项目</a>
    <button data-tab="search" class="tab active">检索</button>
    <button data-tab="ask" class="tab">问答</button>
    <button data-tab="agent" class="tab">Agent</button>
    <button data-tab="library" class="tab">论文库</button>
  </nav>
</header>
<main>
  <section id="tab-search" class="tabpanel active">
    <div class="row">
      <input id="search-q" placeholder="输入检索词，如：注意力机制">
      <button id="search-btn">检索</button>
      <label class="check"><input type="checkbox" id="web-check"> 联网（arXiv）</label>
    </div>
    <div id="search-results"></div>
  </section>
  <section id="tab-ask" class="tabpanel">
    <div class="row">
      <input id="ask-q" placeholder="输入问题，如：这篇论文提出了什么方法？">
      <button id="ask-btn">提问</button>
      <label class="check"><input type="checkbox" id="ask-web"> 联网（arXiv）</label>
    </div>
    <div id="ask-hint" class="hint hidden"></div>
    <div id="ask-status" class="ask-status hidden"></div>
    <pre id="ask-answer"></pre>
    <div id="ask-sources"></div>
  </section>
  <section id="tab-agent" class="tabpanel">
    <div class="agent-layout">
      <div class="agent-main">
        <div id="agent-flow"></div>
        <div id="agent-pending" class="hidden"></div>
        <div id="agent-status" class="ask-status hidden"></div>
        <div class="row">
          <input id="agent-q" placeholder="输入研究任务，如：比较 CRAB 与 BACO 的方法差异">
          <button id="agent-btn">发送</button>
          <button id="agent-new">新会话</button>
        </div>
      </div>
      <aside class="agent-side">
        <h2>Run 审计</h2>
        <div id="agent-runs"></div>
        <div id="agent-run-events"></div>
      </aside>
    </div>
  </section>
  <section id="tab-library" class="tabpanel">
    <div class="row">
      <input id="lib-q" placeholder="按标题/作者筛选">
      <button id="lib-btn">筛选</button>
      <button id="reindex-btn">重新索引</button>
    </div>
    <table id="lib-table">
      <thead><tr><th>标题</th><th>作者</th><th>年份</th><th>页数</th><th>分块</th><th>路径</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="lib-info"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
