[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagent"
dynamic = ["version"]
description = "Pagent：论文整理与检索 Agent——整理本地论文资料库，提供检索、问答与受控 Agent 对话"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "fastembed>=0.3",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    "numpy>=1.26",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "textual>=0.60",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pagent = "paper_agent.cli:app"
paper = "paper_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "paper_agent.__version__"}

[tool.setuptools.package-data]
paper_agent = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
